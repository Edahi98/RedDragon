<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- Warm Glowing Orbs -->
    <radialGradient id="orb1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb3" cx="10%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0" />
    </radialGradient>

    <!-- Smooth Layered Waves -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#fcd34d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filter for ultra-smooth blur -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Base canvas -->
  <rect width="1440" height="900" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <rect width="1440" height="900" fill="url(#orb1)" />
  <rect width="1440" height="900" fill="url(#orb2)" />
  <rect width="1440" height="900" fill="url(#orb3)" />

  <!-- Soft Layered Organic Shapes -->
  <path d="M-100,250 C300,150 600,400 1000,220 C1300,80 1500,200 1600,180 L1600,900 L-100,900 Z" fill="url(#waveGrad1)" />
  <path d="M-100,450 C200,320 700,550 1100,380 C1400,250 1550,420 1600,390 L1600,900 L-100,900 Z" fill="url(#waveGrad2)" />

  <!-- Subtle glowing accent curve -->
  <path d="M-50,180 Q350,380 850,190 T1550,280" fill="none" stroke="#f97316" stroke-opacity="0.15" stroke-width="80" filter="url(#softBlur)" />
</svg>
